<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape the Bennett House · NURSE 154 Review</title>
<style>
  :root {
    --ink: #1f2a30; --muted: #5b6770; --line: #dfe3e6; --bg: #f6f3ee; --card: #ffffff;
    --teal: #1d5c63; --teal-soft: #e3efef; --gold: #b7791f; --gold-soft: #fbf1df;
    --good: #2f6b3a; --good-soft: #e6f2e7; --bad: #a33a2c; --bad-soft: #f8e7e4;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 18px 64px; }
  header.hero { background: var(--teal); color: #fff; border-radius: var(--radius); padding: 28px 28px 24px; margin-bottom: 20px; }
  .hero .eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; opacity: .8; margin: 0 0 6px; }
  .hero h1 { margin: 0 0 8px; font-size: 32px; line-height: 1.15; }
  .hero p { margin: 0; max-width: 640px; opacity: .95; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 18px; }
  h2 { font-size: 22px; margin: 0 0 6px; }
  h3 { font-size: 17px; margin: 18px 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .how { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 8px; }
  .how div { background: var(--teal-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .how b { display: block; color: var(--teal); margin-bottom: 2px; }
  .doors { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
  .door { flex: 1 1 110px; border-radius: 10px; padding: 10px 8px; text-align: center; font-size: 13px; border: 1px solid var(--line); background: #fff; color: var(--muted); cursor: default; }
  .door .ic { font-size: 22px; display: block; }
  .door.open { border-color: var(--teal); color: var(--ink); cursor: pointer; }
  .door.done { background: var(--good-soft); border-color: #b9d8bd; color: var(--good); cursor: pointer; }
  .door.current { box-shadow: 0 0 0 3px var(--teal-soft); border-color: var(--teal); }
  .scene { background: var(--gold-soft); border-left: 4px solid var(--gold); padding: 12px 14px; border-radius: 8px; font-style: italic; margin: 10px 0 6px; }
  .puzzle { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 16px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--teal); background: var(--teal-soft); padding: 2px 8px; border-radius: 999px; margin-right: 6px; }
  .pid { font-weight: 700; }
  ol.opts { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
  ol.opts li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; user-select: none; }
  ol.opts li .num { flex: 0 0 26px; height: 26px; border-radius: 50%; background: #eef1f3; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  ol.opts li.marked { border-color: var(--teal); background: var(--teal-soft); }
  ol.opts li.marked .num { background: var(--teal); color: #fff; }
  .keyline { font-size: 14px; background: #f4f6f7; border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
  .rows td.inp { width: 72px; }
  .rows input { width: 56px; padding: 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; text-align: center; }
  .scratch { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .lock { margin-top: 20px; padding: 16px; border-radius: 10px; background: #f4f6f7; }
  .lock label { font-weight: 600; display: block; margin-bottom: 6px; }
  .lock .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .lock input { flex: 1 1 220px; font: 600 18px/1 ui-monospace, Menlo, Consolas, monospace; padding: 10px 12px; border: 1px solid #c9d0d4; border-radius: 8px; letter-spacing: .08em; }
  button { font: 600 15px/1 inherit; padding: 11px 16px; border-radius: 8px; border: 1px solid var(--teal); background: var(--teal); color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: var(--teal); }
  button:focus-visible, input:focus-visible, li:focus-visible, .door:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .msg { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-weight: 600; }
  .msg.bad { background: var(--bad-soft); color: var(--bad); }
  .msg.good { background: var(--good-soft); color: var(--good); }
  .hint { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--gold-soft); font-size: 15px; }
  details.debrief { margin-top: 14px; border: 1px solid #b9d8bd; background: var(--good-soft); border-radius: 10px; padding: 10px 14px; }
  details.debrief summary { cursor: pointer; font-weight: 700; color: var(--good); }
  details.debrief table { margin-top: 8px; background: #fff; border-radius: 8px; }
  .final { text-align: center; }
  .howto { margin: 4px 0 0; font-size: 14px; color: var(--teal); background: #f1f7f7; border-radius: 6px; padding: 6px 10px; }
  .letter { display: inline-block; margin-left: 6px; min-width: 30px; text-align: center; padding: 2px 8px; border-radius: 6px; background: var(--good); color: #fff; font-size: 18px; }
  .ring { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 14px 0 6px; }
  .ring .slot { width: 64px; height: 74px; border: 2px solid var(--teal); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 700 28px/1 ui-monospace, Menlo, Consolas, monospace; color: var(--teal); background: var(--teal-soft); }
  .ring .slot small { font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; font-size: 11px; font-weight: 400; line-height: 1.2; color: var(--muted); margin-top: 6px; }
  .final .big { font-size: 48px; }
  .stamp { display: inline-block; margin-top: 10px; padding: 8px 14px; border: 2px dashed var(--good); border-radius: 10px; color: var(--good); font-weight: 700; }
  .footer { font-size: 13px; color: var(--muted); text-align: center; margin-top: 28px; }
  .reset { background: none; border: none; color: var(--muted); text-decoration: underline; padding: 0; font-weight: 400; font-size: 13px; }
  @media (max-width: 560px) { .hero h1 { font-size: 26px; } .card { padding: 18px; } }
</style>
</head>

    Array.prototype.forEach.call(nav.querySelectorAll('[data-i]'), function (el) {
      var go = function () { view = +el.getAttribute('data-i'); render(); window.scrollTo({ top: nav.offsetTop - 10, behavior: 'smooth' }); };
      el.addEventListener('click', go);
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
  }

  function puzzleHTML(p) {
    var h = '<div class="puzzle"><p><span class="tag">' + esc(p.kind) + '</span><span class="pid">Puzzle ' + esc(p.id) + '.</span> ' + esc(p.prompt) + '</p><p class="howto">' + HOWTO[p.kind] + '</p>';
    if (p.options) {
      h += '<ol class="opts">' + p.options.map(function (o, k) { return '<li tabindex="0" role="checkbox" aria-checked="false"><span class="num">' + (k + 1) + '</span><span>' + esc(o) + '</span></li>'; }).join('') + '</ol>';
    }
    if (p.rows) {
      h += '<div class="keyline"><b>Key:</b> ' + esc(p.keyLine) + '</div><table class="rows"><thead><tr><th>Row</th><th>Situation</th><th>#</th></tr></thead><tbody>' +
        p.rows.map(function (r, k) { return '<tr><td><b>' + 'abcdefgh'[k] + '</b></td><td>' + esc(r) + '</td><td class="inp"><input inputmode="numeric" maxlength="1" aria-label="Number for row ' + 'abcdefgh'[k] + '"></td></tr>'; }).join('') + '</tbody></table>';
    }
    return h + '</div>';
  }

  function debriefHTML(i, openIt) {
    var k = keys[i] && keys[i].rows; if (!k) return '';
    return '<details class="debrief"' + (openIt ? ' open' : '') + '><summary>Room ' + (i + 1) + ' rationales</summary><table><thead><tr><th>Puzzle</th><th>Answer</th><th>Why</th></tr></thead><tbody>' +
      k.map(function (r) { return '<tr><td><b>' + esc(r[0]) + '</b></td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('') + '</tbody></table></details>';
  }

  function render() {
    renderDoors();
    var main = document.getElementById('room');
    if (view === rooms.length) return renderFinal(main);
    var c = contents[view], done = view < solved.length;
    var h = '<section class="card"><h2>' + c.icon + ' Room ' + c.n + ': ' + esc(c.title) + '</h2><div class="scene">' + esc(c.scene) + '</div>';
    h += c.puzzles.map(puzzleHTML).join('');
    if (done) {
      h += '<div class="msg good">Unlocked with code ' + esc(formatShape(solved[view], c.codeShape)) + '. Your key letter is <span class="letter">' + esc(keys[view].letter) + '</span></div>' + debriefHTML(view, true);
      h += '<p style="margin-top:14px"><button type="button" id="next">' + (view + 1 < rooms.length ? 'Go to Room ' + (view + 2) + ' →' : 'Go to the final door →') + '</button></p>';
    } else {
      h += '<div class="lock"><label for="code">Room ' + c.n + ' code <span style="font-weight:400;color:var(--muted)">(format ' + esc(c.codeShape) + ')</span></label>' +
        '<p class="howto">Room code = ' + c.puzzles.map(function (p) { return p.id; }).join(' \u2013 ') + ', with a dash between each answer.</p><div class="row"><input id="code" autocomplete="off" placeholder="' + esc(c.codeShape) + '"><button type="button" id="try">Unlock</button><button type="button" class="ghost" id="hintBtn">Need a hint?</button></div><div id="out" aria-live="polite"></div><div id="hintBox"></div></div>';
    }
    h += '</section>';
    main.innerHTML = h;
    Array.prototype.forEach.call(main.querySelectorAll('ol.opts li'), function (li) {
      var t = function () { var on = li.classList.toggle('marked'); li.setAttribute('aria-checked', on); };
      li.addEventListener('click', t);
      li.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); t(); } });
    });
    if (done) { document.getElementById('next').onclick = function () { view++; render(); }; return; }
    var inp = document.getElementById('code');
    var attempt = function () {
      var d = digits(inp.value), out = document.getElementById('out');
      if (!d) { out.innerHTML = '<div class="msg bad">Enter your code first.</div>'; return; }
      if (cyrb53(d + DATA.salt) === rooms[view].hash) {
        solved[view] = d; save(); unlockChain(); render();
      } else {
        out.innerHTML = '<div class="msg bad">Not yet. Check each puzzle again. One wrong answer changes the whole code.</div>';
      }
    };
    document.getElementById('try').onclick = attempt;
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') attempt(); });
    document.getElementById('hintBtn').onclick = function () { document.getElementById('hintBox').innerHTML = '<div class="hint"><b>Hint:</b> ' + esc(c.hint) + '</div>'; };
  }

  function formatShape(d, shape) { var i = 0; return shape.replace(/_/g, function () { return d[i++] || ''; }); }

  function renderFinal(main) {
        var h = '<section class="card final"><h2>🚪 The final door</h2>';
    if (finalData) {
      var when = new Date().toLocaleString();
      h += '<div class="big" aria-hidden="true">🎉</div><h2>' + esc(finalData.title) + '</h2><p>' + esc(finalData.body) + '</p><div class="stamp">NURSE 154 Escape Room · Completed · ' + esc(when) + '</div>';
      h += '<div style="text-align:left">' + rooms.map(function (r, i) { return debriefHTML(i, false); }).join('') + '</div>';
    } else {
      var ring = rooms.map(function (r, i) { return '<span class="slot">' + (keys[i] ? esc(keys[i].letter) : '?') + '<small>Room ' + (i + 1) + '</small></span>'; }).join('');
      h += '<p>You collected one key letter from each room. Here they are, in room order. Type them as one word to open the front door.</p><div class="ring">' + ring + '</div>' +
        '<div class="lock" style="text-align:left"><label for="fcode">Final password</label><div class="row"><input id="fcode" autocomplete="off" placeholder="6 letters"><button type="button" id="ftry">Open the door</button></div><div id="fout" aria-live="polite"></div></div>';
    }
    main.innerHTML = h + '</section>';
    if (finalData) return;
    var f = document.getElementById('fcode');
    var go = function () {
      var d = f.value.replace(/[^a-z]/gi, '').toUpperCase();
      if (cyrb53(d + DATA.salt) === DATA.finalHash) { solved[rooms.length] = d; save(); unlockChain(); render(); }
      else document.getElementById('fout').innerHTML = '<div class="msg bad">Not yet. Type the six key letters in room order as one word.</div>';
    };
    document.getElementById('ftry').onclick = go;
    f.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  }

  document.getElementById('reset').onclick = function () {
    solved = []; save(); unlockChain(); view = 0; render();
  };

  unlockChain();
  view = Math.min(solved.length, rooms.length);
  render();
})();
</script>
</body>
</html>
